name: Build and push

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }} @ build-push-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_BASE: ghcr.io/wurly200a/builder-esp32

jobs:
  generate-matrix:
    name: Generate build matrix
    runs-on: ubuntu-22.04
    outputs:
      version_matrix: ${{ steps.matrix.outputs.version_matrix }}
      family_matrix: ${{ steps.matrix.outputs.family_matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Build matrix from esp-idf-versions.json
        id: matrix
        run: |
          VERSION_MATRIX=$(jq -c '[to_entries[] | select(.key | startswith("_") | not) | .key as $family | .value[] | {family: $family, version: .}]' esp-idf-versions.json)
          FAMILY_MATRIX=$(jq -c '[to_entries[] | select(.key | startswith("_") | not) | {family: .key, latest: .value[-1]}]' esp-idf-versions.json)
          echo "version_matrix=${VERSION_MATRIX}" >> "$GITHUB_OUTPUT"
          echo "family_matrix=${FAMILY_MATRIX}" >> "$GITHUB_OUTPUT"

  build-push:
    name: Build ${{ matrix.family }}:${{ matrix.version }}
    needs: generate-matrix
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.version_matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Github Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
          registry: ghcr.io

      - name: Check whether this version is already published
        id: check
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="${{ env.IMAGE_BASE }}/${{ matrix.family }}:${{ matrix.version }}"
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "Already published: $IMAGE (skipping build)"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Pull requests only validate that the build still succeeds; nothing is pushed.
      - name: Build (validate only)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ${{ matrix.family }}
          build-args: |
            ESP_IDF_VERSION=v${{ matrix.version }}
          push: false
          provenance: false

      # Published patch versions are immutable: build/push only the first time a version appears.
      - name: Build and push
        if: github.event_name != 'pull_request' && steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ${{ matrix.family }}
          build-args: |
            ESP_IDF_VERSION=v${{ matrix.version }}
          push: true
          provenance: false
          tags: ${{ env.IMAGE_BASE }}/${{ matrix.family }}:${{ matrix.version }}

  update-latest-alias:
    name: Point ${{ matrix.family }}:latest at ${{ matrix.latest }}
    needs: [generate-matrix, build-push]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.family_matrix) }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Github Registry
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
          registry: ghcr.io

      - name: Re-point :latest without rebuilding
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE_BASE }}/${{ matrix.family }}:latest \
            ${{ env.IMAGE_BASE }}/${{ matrix.family }}:${{ matrix.latest }}
